<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Day Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        
        .fade-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(10px) scale(0.98);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Subtle floating animation for the initial envelope */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-10 text-center border border-gray-100">
        
        <!-- Content Wrapper (Used for fade transitions) -->
        <div id="content-wrapper" class="fade-transition fade-in flex flex-col items-center justify-center min-h-[300px]">
            
            <!-- Icon Container -->
            <div id="icon-container" class="mb-8 animate-float">
                <!-- Closed Envelope SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-lg text-yellow-500">
                    <rect width="20" height="16" x="2" y="4" rx="2" fill="#fef08a"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
            </div>

            <!-- Text Message -->
            <h1 id="message-text" class="text-2xl font-semibold text-gray-800 mb-8 leading-snug">
                You have 1 new message
            </h1>

            <!-- Action Button -->
            <button id="action-btn" onclick="handleAction()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-medium py-3 px-10 rounded-full shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                Read
            </button>
            
        </div>
    </div>

    <script>
        // --- SVG Asset Constants ---
        const SVGS = {
            openEnvelope: `
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-lg text-yellow-500">
                    <path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z" fill="#fef08a"/>
                    <path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"/>
                </svg>`,
            imageFile: `
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-lg text-blue-500">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" fill="#dbeafe"/>
                    <circle cx="9" cy="9" r="2" fill="#60a5fa"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>`,
            heart: `
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-lg text-pink-500">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="#fce7f3"/>
                </svg>`
        };

        // --- State Management ---
        let currentStep = 1;

        // Elements
        const wrapper = document.getElementById('content-wrapper');
        const iconContainer = document.getElementById('icon-container');
        const messageText = document.getElementById('message-text');
        const actionBtn = document.getElementById('action-btn');

        // Helper function to trigger local file downloads
        function triggerDownload(filename) {
            const link = document.createElement('a');
            link.href = filename;
            link.download = filename;
            link.target = '_blank'; // Failsafe for some browsers
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Helper function to animate UI updates
        function updateUI(updatesCallback, delayAfter = 0) {
            // Fade out
            wrapper.classList.remove('fade-in');
            wrapper.classList.add('fade-out');

            setTimeout(() => {
                // Apply updates while hidden
                updatesCallback();
                
                // Remove floating animation after first interaction
                if (currentStep > 1) {
                    iconContainer.classList.remove('animate-float');
                }

                // Fade back in
                wrapper.classList.remove('fade-out');
                wrapper.classList.add('fade-in');
            }, 400); // Wait for CSS fade-out transition
        }

        // --- Main Logic ---
        function handleAction() {
            if (currentStep === 1) {
                // 1. Download PDF
                triggerDownload('a.pdf');
                
                // 2. Change to "Message received" state
                updateUI(() => {
                    messageText.textContent = "Message received";
                    iconContainer.innerHTML = SVGS.openEnvelope;
                    actionBtn.style.display = 'none'; // Hide button momentarily
                });

                // 3. Automatically switch to "New Image" state after 2.5 seconds
                setTimeout(() => {
                    updateUI(() => {
                        messageText.textContent = "You have been sent one new image";
                        iconContainer.innerHTML = SVGS.imageFile;
                        actionBtn.textContent = "View Image";
                        actionBtn.style.display = 'inline-block'; // Show button again
                        currentStep = 2; // Advance state
                    });
                }, 2500);

            } else if (currentStep === 2) {
                // 4. Download PNG
                triggerDownload('b.png');
                
                // 5. Change to final "Thank You" state
                updateUI(() => {
                    messageText.textContent = "Thank you for using our service, we are happy to serve you on your special day!";
                    iconContainer.innerHTML = SVGS.heart;
                    actionBtn.style.display = 'none'; // Hide button permanently
                });
            }
        }
    </script>
</body>
</html>
